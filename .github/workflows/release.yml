name: Release

# Automated release pipeline. The manual flow stays the same up to publishing:
# commit on master, bump the version, add a CHANGELOG entry, commit, then
#   gh release create vX.Y.Z --title "..." --notes "<release notes>"
# Publishing fires this workflow (no asset needed on the create call), which:
#   1. syntax-checks every module in addon/ (fail fast: nothing broken ships),
#   2. rebuilds the .ankiaddon from the tag (version forced to the tag),
#   3. attaches it to the GitHub release (overwriting on re-runs).
#
# The AnkiWeb listing was removed (issue #2), so there is deliberately NO AnkiWeb
# upload step and no ANKIWEB_* secrets here. GitHub Releases is the only
# distribution channel. Do not re-add one without reversing that decision: the
# upload action creates a brand-new listing when `addon-id` is empty, which would
# resurrect the listing that was deliberately taken down.
#
# To rebuild/republish an existing tag without cutting a new release:
# Actions → Release → Run workflow → enter the tag (e.g. v1.9.0).
# To rehearse the pipeline (check + build) without touching the release:
# same dialog, tick `dry_run`.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to rebuild/republish (e.g. v1.9.0). With dry_run, a branch (e.g. master) is also accepted."
        required: true
      dry_run:
        description: "Rehearse only: run the check and the build, skip the release attach"
        type: boolean
        default: false

permissions:
  contents: write # attach the .ankiaddon to the release

jobs:
  build-test-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve and validate ref
        id: ref
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_REF: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          ref="${EVENT_TAG:-$INPUT_REF}"
          if [ -z "$ref" ]; then
            echo "::error::No ref given. Pass one via workflow_dispatch." >&2
            exit 1
          fi
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          # Fail early and legibly. A ref that does not exist otherwise
          # surfaces much later as a raw "upload-pack: not our ref" failure
          # from actions/checkout, and a missing release only fails at the
          # attach step -- after the check and build have already run.
          if gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${ref}" >/dev/null 2>&1; then
            is_tag=true
          elif [ "$DRY_RUN" = "true" ] && gh api "repos/${GITHUB_REPOSITORY}/branches/${ref}" >/dev/null 2>&1; then
            # Branch builds are rehearsal-only: a real release always ships
            # from a tag, so nothing may ever be published off an untagged commit.
            is_tag=false
            echo "::notice::'$ref' is a branch, not a tag; dry run only, nothing will be published."
          else
            echo "::error::'$ref' is neither a tag nor a branch in this repository." >&2
            exit 1
          fi
          # --repo is mandatory here: this step runs before actions/checkout,
          # so gh has no git remote to infer the repository from and would fail
          # with "failed to run git" instead of answering the question.
          if [ "$is_tag" = "true" ] && ! gh release view "$ref" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$DRY_RUN" != "true" ]; then
              echo "::error::No GitHub release found for '$ref'. Create one first." >&2
              exit 1
            fi
            echo "::warning::No GitHub release for '$ref'; a dry run skips the uploads anyway."
          fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry_run=true" >> "$GITHUB_OUTPUT"
            echo "Dry run: the release attach step will be skipped."
          fi

      - name: Check out the ref
        uses: actions/checkout@v4
        with:
          ref: ${{ steps.ref.outputs.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Derive version
        id: version
        run: |
          set -euo pipefail
          version="${TAG#v}"
          if [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Building $version from $TAG"
          elif [ "$DRY_RUN" = "true" ]; then
            # Branch rehearsal: there is no version tag, so use the version the
            # working tree already carries. Never published -- a real release
            # always builds from a tag.
            version=$(cat addon/VERSION)
            if ! [[ "$version" =~ ^[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]; then
              echo "::error::addon/VERSION is '$version', which is not a version." >&2
              exit 1
            fi
            echo "version=$version" >> "$GITHUB_OUTPUT"
            echo "Dry run from branch '$TAG': building with the tree's version $version"
          else
            echo "::error::'$TAG' is not a version tag (expected v<major>.<minor>[.<patch>])." >&2
            exit 1
          fi
        env:
          TAG: ${{ steps.ref.outputs.ref }}
          DRY_RUN: ${{ steps.ref.outputs.dry_run }}

      - name: Syntax-check the addon package
        run: |
          set -euo pipefail
          # The runner has no Anki install and this add-on imports `aqt` at
          # module scope, so importing is impossible here. Byte-compiling is
          # the strongest check available without a live Anki: it parses every
          # shipped module, so a syntax error or bad encoding cannot reach users.
          count=0
          while IFS= read -r f; do
            python3 -m py_compile "$f"
            count=$((count + 1))
          done < <(find addon -name '*.py' -not -path '*/__pycache__/*' | sort)
          echo "Byte-compiled $count module(s)."
          if [ "$count" -eq 0 ]; then
            echo "::error::No Python modules found under addon/ -- the package would ship empty." >&2
            exit 1
          fi

      - name: Build .ankiaddon
        id: build
        run: |
          set -euo pipefail
          # make_ankiaddon.py imports bump.py from the repo root, so run it there.
          python3 make_ankiaddon.py "${{ steps.version.outputs.version }}"
          file=$(ls Anki_Terminator_Companion_v*.ankiaddon)
          echo "ankiaddon=$file" >> "$GITHUB_OUTPUT"
          echo "Built $file ($(wc -c < "$file") bytes)"

      - name: Attach to GitHub release
        if: steps.ref.outputs.dry_run != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="${{ steps.ref.outputs.ref }}"
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --title "Anki Terminator Companion ${{ steps.version.outputs.version }}" --generate-notes
          fi
          gh release upload "$TAG" "${{ steps.build.outputs.ankiaddon }}" --clobber
